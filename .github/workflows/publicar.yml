name: Publicar reels

on:
  schedule:
    - cron: "7,37 * * * *"      # a cada 30 min; publica o que já passou do horário
    - cron: "23 11 * * *"       # 08h23 de Brasília: lê os insights de 48 h
  workflow_dispatch:
    inputs:
      modo:
        description: "conferir = só a chave e a fila · teste = cria um reel de teste sem publicar · publicar = publica o que venceu · medir = insights 48 h + collabs · colab = diagnóstico de colaboradores + collabs"
        type: choice
        options: [conferir, teste, publicar, medir, colab]
        default: conferir

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write
  issues: write       # aviso "Collab: convite pendente para trocar no app"

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Publicar o que está com horário vencido
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODO: ${{ github.event.inputs.modo || (github.event.schedule == '23 11 * * *' && 'medir') || 'publicar' }}
        run: python scripts/publicar.py
      - name: Gravar o resultado no repositório
        if: always()
        run: |
          git config user.name "okl-bot"
          git config user.email "okl-bot@users.noreply.github.com"
          git add -A fila publicados videos bonde.json relatorios
          git diff --cached --quiet || (git commit -m "Publicação $(date -u +%FT%H:%MZ)" && git pull --rebase && git push)
